components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      description: Verified acting-user access token. Issuer/audience/auth integration established in M00; never use service_role in browser/MCP
        client.
    ReviewToken:
      type: apiKey
      in: header
      name: X-Review-Token
      description: Raw expiring bearer review token only for initial exchange. Never log.
    ReviewSession:
      type: apiKey
      in: header
      name: X-Review-Session
      description: Short-lived session scoped to one link/series; server verifies link live for every request. Cookie adapter may be used by browser.
        Browser uses the documented scoped HttpOnly cookie adapter; raw credentials are never stored in browser localStorage/sessionStorage.
    MediaGrant:
      type: apiKey
      in: header
      name: X-Media-Grant
      description: Secret embedded in private external PDF, bound to one export and fixed version; parent link live-view grant required. Browser
        uses the documented scoped HttpOnly cookie adapter; raw credentials are never stored in browser localStorage/sessionStorage.
    ServiceBearer:
      type: http
      scheme: bearer
      description: Narrow service identity plus per-job lease token; not an internal user token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Scoped to actor+operation; replay same body returns original response; different body returns 409.
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Optional exact-response replay for an uncertain mutation acknowledgement. A repeated key must keep the identical semantic request;
        current authority is rechecked.
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 200
      description: Opaque resource identifier. Do not parse business meaning or assume source database PK type.
    RowVersion:
      type: integer
      minimum: 1
      description: Optimistic version from the last read of the mutated resource; stale write returns 409.
    DateTime:
      type: string
      format: date-time
    NullableText:
      anyOf:
      - type: string
      - type: 'null'
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
      required:
      - code
      - message
      - details
      - retryable
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
        error:
          $ref: '#/components/schemas/Error'
      required:
      - request_id
      - error
    Warning:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        entity_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - code
      - message
      - entity_id
    Page:
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - next_cursor
    Capabilities:
      type: object
      additionalProperties: false
      properties:
        principal_id:
          $ref: '#/components/schemas/Id'
        capabilities:
          type: array
          items:
            type: string
        timezone:
          type: string
        enabled_modules:
          type: array
          items:
            type: string
        upload_policy:
          $ref: '#/components/schemas/UploadPolicy'
      required:
      - principal_id
      - capabilities
      - timezone
      - enabled_modules
      - upload_policy
    UploadPolicy:
      type: object
      additionalProperties: false
      properties:
        allowed_mime_types:
          type: array
          items:
            type: string
        maximum_file_bytes:
          type: integer
          minimum: 1
        recommended_batch_size:
          type: integer
          const: 200
        available_purposes:
          type: array
          items:
            type: string
            enum:
            - specs
            - candidate_video
            - candidate_support
            - client_logo
