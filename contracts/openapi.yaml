        resource_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        poll_url:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_for_input
          - succeeded
          - failed
          - cancelled
          description: Recorded durable job status for this acknowledgement. Reusing an existing job reports its current status; an idempotent
            replay may retain its original acknowledgement. Read poll_url for current status.
