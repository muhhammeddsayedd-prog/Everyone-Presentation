    UploadSession:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        asset_id:
          $ref: '#/components/schemas/Id'
        protocol:
          type: string
          enum:
          - tus
          - signed_put
        upload_url:
          description: A scoped transfer URL for an open session. Closed sessions return null and empty upload_headers.
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        upload_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
          enum:
          - open
          - completed
          - cancelled
          - expired
        maximum_bytes:
          type: integer
          minimum: 1
        upload_metadata:
          type: object
          additionalProperties: false
          properties:
            bucketName:
              type: string
              minLength: 1
              maxLength: 2000
            objectName:
              type: string
              minLength: 1
              maxLength: 2000
            contentType:
              type: string
              minLength: 1
              maxLength: 2000
            cacheControl:
              type: string
              minLength: 1
              maxLength: 2000
          required:
          - bucketName
          - objectName
          - contentType
          - cacheControl
          description: Exact server-reserved TUS metadata. Never accept a caller-selected destination.
        chunk_size:
          type: integer
          const: 6291456
      required:
      - id
      - asset_id
      - protocol
      - upload_url
      - upload_headers
      - expires_at
      - status
      - maximum_bytes
      allOf:
      - if:
          properties:
            status:
              const: open
        then:
          properties:
            upload_url:
              type: string
        else:
          properties:
            upload_url:
              type: 'null'
            upload_headers:
              maxProperties: 0
      - if:
          properties:
            protocol:
              const: tus
        then:
          required:
          - upload_metadata
          - chunk_size
