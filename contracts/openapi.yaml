          type: string
          enum:
          - read
          - write
          default: read
          description: Lease-scoped exact-object access. Write is only a newly reserved immutable output, never an original.
      required:
      - job_id
      - attempt_id
      - lease_token
      - asset_id
    ServiceAssetAccess:
      type: object
      additionalProperties: false
      description: Private service-only transfer capability. Headers are credentials and must not enter URLs, ordinary job metadata, logs or n8n
        envelopes. Exact object, method and lifetime are lease-bound; no arbitrary destination/signing interface exists.
      properties:
        asset_id:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
          - GET
          - POST
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '#/components/schemas/DateTime'
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - asset_id
      - url
      - method
      - headers
      - expires_at
      - mime_type
      - size_bytes
      - sha256
    JobOutputReservationResult:
      type: object
