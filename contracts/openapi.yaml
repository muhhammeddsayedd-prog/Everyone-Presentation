    Job:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        workspace_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        kind:
          type: string
          enum:
          - specs_extract
          - candidate_scan
          - frame_extract
          - ai_suggestion
          - presentation_render
          - presentation_export
          - review_fit
          - candidate_appearance
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_for_input
          - succeeded
          - failed
          - cancelled
        stage:
          type: string
        attempt:
          type: integer
          minimum: 0
        progress_completed:
          type: integer
          minimum: 0
        progress_total:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        batch_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        input_asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        resource_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        row_version:
          $ref: '#/components/schemas/RowVersion'
        frame_extraction:
          $ref: '#/components/schemas/FrameExtractionOutcome'
        can_retry:
          type: boolean
          description: Current server-derived action for presentation_render, independent of the lifetime attempt count.
        can_cancel:
          type: boolean
          description: Current server-derived cancellation action for presentation_render.
        candidate_result:
          type: object
          additionalProperties: false
          description: 'Present on a succeeded candidate_scan: the person and the project row the upload produced (workspace_candidate_id is null
            for a re-scan) and the recorded outcomes (null for jobs finished before outcomes were recorded).'
          properties:
            candidate_id: &id029
              $ref: '#/components/schemas/Id'
            candidate_media_id: *id029
            workspace_candidate_id: &id042
              anyOf: *id030
            candidate_outcome: &id044
              anyOf:
              - type: string
                enum:
                - created
                - tape_added
                - tape_rescanned
              - type: 'null'
              description: 'What processing did, recorded by the save step: created a new person, added a tape to the existing person, or re-scanned
                a stored tape. null = unknown (finished before outcomes were recorded, or not finished).'
            membership_outcome: &id045
              anyOf:
              - type: string
                enum:
                - added
                - already_member
                - not_requested
              - type: 'null'
              description: 'Project membership outcome recorded by the save step: processing added the person to this project, the person was
                already in it, or no membership was requested (re-scan). null = unknown. Current membership is read from the project list.'
          required:
          - candidate_id
          - candidate_media_id
          - workspace_candidate_id
          - candidate_outcome
          - membership_outcome
      required:
      - id
      - workspace_id
      - kind
      - status
      - stage
      - attempt
      - progress_completed
      - progress_total
      - batch_id
      - input_asset_id
      - resource_id
      - error
      - created_at
      - updated_at
      - row_version
      allOf:
      - if:
          properties:
            kind:
              const: presentation_render
          required:
          - kind
        then:
          required:
          - can_retry
          - can_cancel
      - if:
          properties:
            kind:
              const: presentation_export
          required:
          - kind
        then:
          required:
          - can_retry
          - can_cancel
    JobAccepted:
      type: object
