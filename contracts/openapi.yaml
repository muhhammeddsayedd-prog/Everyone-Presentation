          $ref: '#/components/schemas/Id'
        status:
          type: string
          enum:
          - available
          - not_provided
          - not_captured
        original_text:
          anyOf:
          - &id016
            type: string
            minLength: 1
            maxLength: 200000
            pattern: ^[^\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]*\S[^\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]*$
          - type: 'null'
          description: Frozen original-language provenance; use the captured english_text for English display. Never read current library text
            for an old version.
        languages:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 1000
            pattern: ^[^\u0000-\u001f\u007f]*\S[^\u0000-\u001f\u007f]*$
        source_kind:
          type: string
          const: source_transcript
        source_sha256:
          anyOf:
          - &id017
            type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        english_text:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200000
            pattern: ^[^\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]*\S[^\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]*$
          - type: 'null'
          description: English display transcript. Absence is explicit; never substitute original-language text.
        english_status:
          type: string
          enum:
          - available
          - not_provided
          - unavailable
          - not_captured
        english_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
      required:
      - version_id
      - asset_id
      - status
      - original_text
      - languages
      - source_kind
      - source_sha256
      description: Plain original source text captured immutably with this version/video. Not slide wording, captions or factual review. No live-library
        fallback; legacy versions explicitly report not_captured.
      allOf:
      - if:
          properties:
            status:
              const: available
          required:
          - status
        then:
          properties:
            original_text: *id016
            source_sha256: *id017
        else:
          properties:
            original_text:
              type: 'null'
            source_sha256:
