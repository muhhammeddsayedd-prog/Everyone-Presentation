function candidateCard(c){return `<article class="candidate-card"><div class="candidate-media" data-action="profile" data-id="${c.id}" role="button" tabindex="0" aria-label="Open ${esc(c.facts.name||c.id)}">${picture(c)}<div class="media-top">${pill(c.reviewed?'Reviewed':'Unreviewed',c.reviewed?'green':'')} ${state.pool.includes(c.id)?pill('In workspace','green'):''}</div><div class="frame-count">${icon('image',12)}${c.frames.length} frames</div></div><div class="candidate-body"><div class="candidate-name"><strong>${esc(c.facts.name||'Unnamed candidate')}</strong><small>${esc(c.id)}</small></div><div class="candidate-meta">${esc([c.facts.age?c.facts.age+' yrs':'Age not provided',c.facts.height||'Height not provided',c.facts.city||'Location not provided'].join(' · '))}</div><div class="candidate-tags"><span>${esc(c.facts.category||'Category not provided')}</span>${c.matchId?`<span style="color:var(--amber)">Possible existing profile</span>`:c.uploaded?'<span>New upload</span>':''}</div><div class="candidate-footer">${btn(state.pool.includes(c.id)?'Assign to role':'Add to casting','assign-open','',`data-id="${c.id}"`,'plus')}${btn('','video','icon',`data-id="${c.id}" aria-label="Play ${esc(c.facts.name||c.id)} video"`,'play')}${c.matchId?btn('Match','duplicate','sm',`data-id="${c.id}"`):''}</div></div></article>`;}
function castingView(){const slots=allSlots(),slot=activeSlot();return heading('04 / Casting organization','Every role. Every option.','Organize candidates by individual slot. Positions and presentation inclusion are independent.',btn('Add role','add-role','','','plus'))+`<div class="stats-row"><div class="stat"><strong>${slots.length}</strong><span>Required slots</span></div><div class="stat"><strong>${new Set(activeAssignments().map(a=>a.slotId)).size}</strong><span>Slots with included options</span></div><div class="stat"><strong>${slots.filter(s=>!activeAssignments().some(a=>a.slotId===s.id)).length}</strong><span>Pending in this output</span></div><div class="stat"><strong>${new Set(activeAssignments().map(a=>a.candidateId)).size}</strong><span>Distinct candidates</span></div></div>${!slots.length?empty('The casting board is ready when you are.','Add a role, load sample casting, or continue to review with no assignments.',`<div class="actions">${btn('Add role','add-role','primary','','plus')}${btn('Load sample project','load-sample','','','spark')}</div>`):`<div class="casting-layout"><aside class="panel slot-list"><div class="slot-section-title">Roles & slots</div>${slots.map(s=>{const count=activeAssignments().filter(a=>a.slotId===s.id).length;return `<button class="slot-item ${s.id===slot.id?'active':''}" data-action="slot" data-id="${s.id}"><div><strong>${esc(s.name)}</strong><small>${count?count+' candidate option'+(count===1?'':'s'):'Pending'}</small></div><span class="slot-count">${count||'—'}</span></button>`;}).join('')}</aside><div><section class="panel panel-pad"><div class="actions" style="justify-content:space-between"><div><div class="eyebrow" style="margin-bottom:6px">${esc(slot.role.scene||'Scene not specified')}</div><h2>${esc(slot.name)}</h2></div><div class="actions">${btn('Requirements','edit-role','ghost sm',`data-id="${slot.roleId}"`,'edit')}${btn('Add candidate','pick-for-slot','primary',`data-slot="${slot.id}"`,'plus')}</div></div><div class="requirement-chips">${[slot.role.age?'Age '+slot.role.age:'Age needs clarification',slot.role.gender||'Gender not specified',slot.role.category||'Category not specified',slot.role.languages||'Language not specified'].map(s=>`<span>${esc(s)}</span>`).join('')}</div><p class="muted small m-top">${esc(slot.role.appearance||'Performance requirements need clarification.')}</p></section>${state.assignments.filter(a=>a.slotId===slot.id).map(assignmentCard).join('')||`<div class="empty m-top">${icon('users',28)}<h3>No candidates assigned</h3><p>This slot will receive a Pending slide with its requirements. You can continue as it is.</p>${btn('Choose from library','pick-for-slot','','data-slot="'+slot.id+'"','plus')}</div>`}</div></div>`}`;}
function assignmentCard(a){const c=cand(a.candidateId);if(!c)return '';return `<article class="assignment"><div class="assignment-main">${picture(c,'assignment-thumb')}<div class="assignment-info"><h3>${esc(c.facts.name||c.id)}</h3><p class="muted small">${esc(c.id)} · ${esc(c.facts.age?c.facts.age+' years':'Age not provided')} · ${esc(c.facts.height||'Height not provided')}</p><div class="actions"><div class="position-toggle" aria-label="Position for ${esc(c.facts.name)}">${['Option','Main','Backup'].map(p=>`<button class="${a.position===p?'active':''}" data-action="position" data-id="${a.id}" data-value="${p}" aria-pressed="${a.position===p}">${p}</button>`).join('')}</div>${btn('Profile','profile','ghost sm',`data-id="${c.id}"`)}</div></div>${btn('','remove-assignment','ghost icon',`data-id="${a.id}" aria-label="Remove candidate from slot"`,'x')}</div><div class="assignment-fields">${field('Availability for this project','assignment.availability',a.availability,`data-id="${a.id}" placeholder="Not provided"`)}${field('Presentation notes for this slot','assignment.notes',a.notes,`data-id="${a.id}" placeholder="Not provided"`)}</div><div class="assignment-bottom"><div class="checks"><label class="check"><input type="checkbox" data-field="assignment.selection" data-id="${a.id}" ${a.selection?'checked':''}>In Selection</label><label class="check"><input type="checkbox" data-field="assignment.shortlist" data-id="${a.id}" ${a.shortlist?'checked':''}>In Shortlist</label></div>${pill(c.reviewed?'Reviewed':'Unreviewed',c.reviewed?'green':'')}</div></article>`;}
function longFields(a){const c=cand(a.candidateId);if(!c)return [];return ['skills','previous','notes'].filter(k=>((a.overrides?.[k]??(k==='notes'?a.notes:c.facts[k]))||'').length>180);}
function reviewView(){const assignments=activeAssignments(),ids=[...new Set(assignments.map(a=>a.candidateId))],slots=allSlots(),pending=slots.filter(s=>!assignments.some(a=>a.slotId===s.id));const flagged=assignments.filter(a=>longFields(a).length);return heading('05 / Final review','A final look before the deck.','Review candidate facts, frames, assignments, and English slide wording. Every warning is bypassable in this prototype.',btn('Preview current data','step','','data-step="5"','slides'))+`<div class="stats-row"><div class="stat"><strong>${assignments.length}</strong><span>Candidate slides</span></div><div class="stat"><strong>${pending.length}</strong><span>Pending slot slides</span></div><div class="stat"><strong>${ids.filter(id=>!cand(id)?.reviewed).length}</strong><span>Profiles to review</span></div><div class="stat"><strong>${flagged.length}</strong><span>Long text flags</span></div></div><div class="two-col" style="grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr)"><div class="stack"><section class="panel"><div class="panel-head"><div><h3>Candidate information</h3><p>Confirmed fact corrections are reused across this workspace.</p></div>${pill('English')}</div>${ids.length?ids.map(id=>{const c=cand(id),as=assignments.filter(a=>a.candidateId===id);const missing=profileFields.filter(k=>k!=='gender'&&!c.facts[k]);return `<div class="review-item">${picture(c)}<div class="info"><strong>${esc(c.facts.name||c.id)}</strong> ${pill(c.reviewed?'Reviewed':'Unreviewed',c.reviewed?'green':'')}<p>${as.map(a=>esc(getSlot(a.slotId)?.name||'Role')+' · '+esc(a.position)).join(' / ')}</p><div class="review-missing">${c.frames.length} frames${missing.length?' · '+missing.length+' missing fields will read “Not provided”':''}</div></div><div class="actions">${btn('Edit & review','profile','sm',`data-id="${c.id}"`)}${btn(c.reviewed?'Confirmed':'Confirm profile','confirm-profile',c.reviewed?'ghost sm':'sm',`data-id="${c.id}"`,c.reviewed?'check':'')}</div></div>`;}).join(''):`<div style="padding:20px">${empty('No included candidates yet','You can generate an empty preview or add candidates at any point.',btn('Find candidates','step','','data-step="2"','users'))}</div>`}</section><section class="panel"><div class="panel-head"><div><h3>Slide wording & project details</h3><p>Shorten presentation wording without replacing full library facts.</p></div></div>${assignments.length?assignments.map(a=>{const c=cand(a.candidateId),long=longFields(a);return `<div class="review-item"><div class="info"><strong>${esc(c.facts.name||c.id)} <span class="muted">/ ${esc(getSlot(a.slotId)?.name)}</span></strong><p>${esc(a.availability||'Availability: Not provided')} · ${esc(a.notes||'Notes: Not provided')}</p>${long.length?`<div class="warn-inline">${icon('info',12)} Text may be too long: ${long.map(k=>esc(k)).join(', ')}</div>`:''}</div>${btn('Edit slide wording','wording','sm',`data-id="${a.id}"`,'edit')}</div>`;}).join(''):'<p class="muted small" style="padding:20px">Slide wording becomes available when a candidate is assigned.</p>'}</section></div><div class="stack"><section class="panel panel-pad"><h3>Presentation summary</h3><div class="review-side-list m-top"><div><span>Output</span><strong>Cast ${esc(state.project.output)}</strong></div><div><span>Language</span><strong>English</strong></div><div><span>Client logo</span><strong>${state.project.clientLogo?(state.project.logoPlacement==='all'?'Every slide':'Cover only'):'Not provided'}</strong></div><div><span>Candidate pages</span><strong>${assignments.length}</strong></div><div><span>Pending pages</span><strong>${pending.length||(!slots.length?1:0)}</strong></div><div><span>PDF frames</span><strong>All together</strong></div><div><span>Missing fields</span><strong>Not provided</strong></div></div><div class="divider"></div>${btn('Confirm and generate','generate','primary wide','','spark')}<p class="field-note">Missing data and incomplete choices will not block generation.</p></section><section class="panel panel-pad"><h3>Pending slots</h3><p class="muted small" style="margin:8px 0 16px">These stay visible in the presentation.</p>${pending.length?pending.map(s=>`<div class="actions" style="justify-content:space-between;margin:10px 0"><span class="small">${esc(s.name)}</span>${pill('Pending','amber')}</div>`).join(''):`<p class="muted small">${slots.length?'Every slot has included candidate options.':'No slots entered. A Pending overview will be included.'}</p>`}</section><div class="notice">${icon('info')}Reviewed confirms profile information. Main, Backup, and Option remain casting choices.</div></div></div>`;}
function reqPairs(r){return [['Age requirement',r?.age],['Gender requirement',r?.gender],['Cast category',r?.category],['Scene / setting',r?.scene],['Performance',r?.appearance],['Languages / skills',[r?.languages,r?.skills].filter(Boolean).join(' · ')],['Shoot date',r?.shootDates],['Location',r?.location],['Availability requirement',r?.availability],['Other instructions',r?.instructions]].map(([label,value])=>({label,value:value||'Needs clarification'}));}
function buildDeck(){const output=state.project.output,assignments=activeAssignments(output),slots=allSlots();const slides=[{kind:'cover',title:state.project.title||'Untitled casting project',subtitle:state.project.client||'Client not provided',output:'Cast '+output,requirements:[],fields:[]}];for(const s of slots){const options=assignments.filter(a=>a.slotId===s.id);if(!options.length){slides.push({kind:'pending',title:s.name,subtitle:s.role.scene||'Scene not provided',role:s.role.name||'Unnamed role',slot:s.name,position:'Pending',requirements:reqPairs(s.role),fields:[],frames:[]});continue;}for(const a of options){const c=cand(a.candidateId),f=c.facts;slides.push({kind:'candidate',title:c.facts.name||c.id,subtitle:`${s.name} · ${a.position}`,candidateName:c.facts.name||c.id,candidateId:c.id,role:s.role.name||'Unnamed role',slot:s.name,position:a.position,scene:s.role.scene||'Scene not provided',assignmentId:a.id,frames:clone(c.frames),sample:c.sample,fields:[['Candidate name / casting ID',[f.name,c.id].filter(Boolean).join(' · ')],['Age / stated range',f.age],['Height / measurements',f.height],['Languages / accents',f.languages],['Skills / experience',a.overrides?.skills??f.skills],['City / usual location',f.city],['Previous projects / roles',a.overrides?.previous??f.previous],['Cast category / classification',f.category],['Availability for this project',a.availability],['Presentation notes',a.overrides?.notes??a.notes]].map(([label,value])=>({label,value:value||'Not provided'})),requirements:[],videoUrl:'',hasLocalVideo:media.has(c.mediaKey),mediaKey:c.mediaKey||'',transcript:c.transcript||'',mediaName:c.mediaName||'',longText:longFields(a).length>0});}}if(!slots.length)slides.push({kind:'pending',title:'Casting requirements',subtitle:'No roles have been entered yet',role:'Casting requirements',slot:'Casting requirements',position:'Pending',requirements:[{label:'Roles & slots',value:'Needs clarification'},{label:'Casting choices',value:'Pending'},{label:'Next step',value:'Add requirements whenever you are ready.'}],fields:[],frames:[]});return {title:state.project.title||'Untitled casting project',client:state.project.client||'',clientLogo:state.project.clientLogo?clone(state.project.clientLogo):null,logoPlacement:state.project.logoPlacement||'cover',output:'Cast '+output,version:state.versions.length+1,createdAt:new Date().toISOString(),revision:state.revision,slides};}
function displayedDeck(){const v=state.versions.find(v=>v.id===ui.versionId);return v?.deck||buildDeck();}
function slideMarkup(slide,index,total,pdf=false,deck=null){const logo=(slide.kind==='cover'||deck?.logoPlacement==='all')?clientLogoMarkup(deck?.clientLogo):'';if(slide.kind==='cover')return `<article class="slide slide-cover"><div class="cover-masthead"><div class="brand">everyone.</div>${logo}</div><div><div class="eyebrow" style="color:#6c6c65">${esc(slide.title)}</div><h2>${esc((deck?.output||'Cast '+state.project.output))}.</h2><h3>${esc(slide.subtitle)}</h3></div><div class="big-dot"></div><div class="slide-footer"><span>English · ${deck?.version?'Version '+deck.version:'Exploration preview'}</span><span>everyone. / ${String(index+1).padStart(2,'0')}</span></div></article>`;if(slide.kind==='pending')return `<article class="slide pending-slide"><div class="slide-header"><div class="slide-brand-group"><div class="brand">everyone.</div>${logo}</div><small>${esc(deck?.output||'Cast '+state.project.output)}</small></div><div class="eyebrow" style="color:#6a6a62">${esc(slide.subtitle)}</div><div class="pending-label">${esc(slide.title)}</div><span class="pill light" style="align-self:flex-start">Pending · no candidate assigned</span><div class="pending-grid">${slide.requirements.map(r=>`<div><small>${esc(r.label)}</small><span>${esc(r.value)}</span></div>`).join('')}</div><div class="slide-footer"><span>Casting requirements remain open.</span><span>${String(index+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span></div></article>`;const frames=slide.frames||[],f=frames.length?ui.slideFrame%frames.length:0;return `<article class="slide ${pdf?'pdf':''}"><div class="slide-header"><div><div class="slide-title">${esc(slide.candidateName||slide.title)}</div><div class="slide-subtitle">${esc(slide.slot)} · ${esc(slide.scene||'')} · ${esc(slide.position)}</div></div><div class="slide-brand-group"><div class="brand">everyone.</div>${logo}</div></div><div class="slide-content"><div class="photos">${frames.length?(pdf?frames.map((src,n)=>`<div class="photo-one"><img src="${esc(src)}" alt="${esc(slide.candidateName)} frame ${n+1}"></div>`).join(''):`<div class="photo-one"><img src="${esc(frames[f])}" alt="${esc(slide.candidateName)} frame ${f+1}"><div class="carousel-controls"><button data-action="frame-prev" aria-label="Previous frame">${icon('left',15)}</button><span>${f+1} / ${frames.length}${slide.sample?' · Sample':''}</span><button data-action="frame-next" aria-label="Next frame">${icon('chevron',15)}</button></div></div>`):`<div class="photo-one"><div class="no-frame">${icon('image',30)}<span>Frames not provided</span></div></div>`}</div><dl class="candidate-data">${slide.fields.map((field,n)=>`<div class="datum ${[0,4,6,9].includes(n)?'full':''}"><dt>${esc(field.label)}</dt><dd>${esc(field.value||'Not provided')}</dd></div>`).join('')}</dl></div><div class="slide-footer"><span>${esc(slide.candidateId)} · ${pdf?'Video available in app':'Candidate presentation'}</span><span>${String(index+1).padStart(2,'0')} / ${String(total).padStart(2,'0')}</span></div></article>`;}
function presentationView(){const deck=displayedDeck(),version=state.versions.find(v=>v.id===ui.versionId),slides=deck.slides;ui.slide=Math.min(Math.max(0,ui.slide),slides.length-1);const slide=slides[ui.slide];return heading('06 / Presentation',version?'Your casting presentation.':'Explore your presentation.','Browse the deck, switch image layouts, and test the candidate video experience.',`${btn('Generate new version','generate','','','spark')}${btn('Download PDF','download-pdf','primary','','down')}`)+`<div class="deck-tools"><div class="version-row">${version?`<select data-field="version" aria-label="Presentation version">${state.versions.map(v=>`<option value="${v.id}" ${v.id===ui.versionId?'selected':''}>V${v.deck.version} · ${esc(v.deck.output)}</option>`).join('')}</select>`:pill('Live exploration preview')}${version&&version.deck.revision!==state.revision?pill('Working data has changed','amber'):version?pill('Saved snapshot','green'):''}</div><div class="segmented" aria-label="Frame layout"><button data-action="pdf-mode" data-value="false" class="${!ui.pdfMode?'active':''}">App · carousel</button><button data-action="pdf-mode" data-value="true" class="${ui.pdfMode?'active':''}">PDF · all frames</button></div></div><div class="presentation-layout"><aside class="thumb-list" aria-label="Slide navigation">${slides.map((s,i)=>`<button class="slide-thumb ${i===ui.slide?'active':''}" data-action="slide" data-index="${i}" aria-label="Slide ${i+1}: ${esc(s.title)}"><div class="thumb-preview ${s.kind==='pending'?'pending':''}">${s.frames?.[0]?`<img src="${esc(s.frames[0])}" alt="">`:''}<div class="thumb-copy"><strong>${s.kind==='cover'?'everyone.':esc(s.slot||s.title)}</strong>${s.kind==='cover'?esc(deck.output):s.kind==='pending'?'Pending':esc(s.candidateName)+' · '+esc(s.position)}</div></div><span>${String(i+1).padStart(2,'0')} · ${esc(s.kind==='candidate'?s.candidateName:s.kind==='cover'?'Cover':s.title)}</span></button>`).join('')}</aside><div class="slide-stage">${slideMarkup(slide,ui.slide,slides.length,ui.pdfMode,deck)}<div class="slide-nav">${btn('Previous','slide-prev','ghost','','left')}<span class="muted">${ui.slide+1} of ${slides.length} slides</span>${btn('Next','slide-next','ghost','','chevron')}</div><div class="actions m-top">${slide.kind==='candidate'?btn('Watch candidate video','video','',`data-id="${slide.candidateId}" data-snapshot="true"`,'play'):''}${slide.kind==='candidate'?btn('Edit candidate','profile','ghost',`data-id="${slide.candidateId}"`,'edit'):''}${slide.kind==='pending'?btn('Work on this slot','jump-slot','ghost',`data-slot-name="${esc(slide.slot)}"`,'edit'):''}</div><div class="draft-note">${ui.pdfMode?'PDF view shows all confirmed frames together.':'App view uses a carousel within each candidate slide.'} ${slide.kind==='candidate'&&slide.longText?'Long wording is kept visible for this unrestricted demo; use final review to refine it. ':''}Local videos remain in this browser session; portable PDF video links will require the connected app.</div></div></div>`;}
function versionsView(){return heading('Presentations','Your casting versions.','Each generated version keeps the content you confirmed at that point.',btn('Generate current data','generate','primary','','spark'))+(state.versions.length?`<div class="cards">${state.versions.slice().reverse().map(v=>`<article class="panel" style="padding:16px"><div class="preview-cover" style="aspect-ratio:16/10"><div class="cover-masthead"><div class="brand">everyone.</div>${clientLogoMarkup(v.deck.clientLogo)}</div><div><h2 style="font-size:30px">${esc(v.deck.output)}.</h2><p style="font-size:11px;margin-top:10px">${esc(v.deck.title)}</p></div><small>V${v.deck.version} · ${v.deck.slides.length} slides</small></div><div class="actions m-top" style="justify-content:space-between"><span class="muted small">${new Date(v.deck.createdAt).toLocaleDateString('en-GB')}</span>${btn('Open version','open-version','',`data-id="${v.id}"`,'arrow')}</div></article>`).join('')}</div>`:empty('No saved presentations yet','Generate from your current information or explore a live preview without adding anything.',btn('Explore preview','step','primary','data-step="5"','slides')));}

else if(type==='duplicate'){const c=cand(id),old=cand(c?.matchId);html=modal('Possible existing candidate','Choose which profile should own this new material.',`<div class="notice m-bottom">${icon('info')}This demo match uses the supplied name. If both profiles occupy the same slot, the existing slot choice will be retained.</div><div class="form-grid"><div>${picture(old,'assignment-thumb')}<h3 class="m-top">${esc(old?.facts.name||'Existing profile')}</h3><p class="muted small">${esc(old?.id)} · saved library information</p></div><div>${picture(c,'assignment-thumb')}<h3 class="m-top">${esc(c?.facts.name||'New upload')}</h3><p class="muted small">${esc(c?.id)} · new Unreviewed material</p></div></div>`,`${btn('Keep as a new profile','keep-new-profile','',`data-id="${id}"`)}${btn('Use existing profile','link-existing','primary',`data-id="${id}"`,'link')}`,true);}
else if(type==='demo'){html=modal('Explore at your own pace','Every stage is open, with or without data.',`<div class="stack"><div class="notice green">${icon('check')}Next, Review, Generate, and PDF download work even when the project is empty.</div><div><h3>Sample project</h3><p class="muted small" style="margin:7px 0 14px">Father, Manager, and three Waiter slots. Two fictional candidates, repeated across roles, with two slots left Pending.</p>${btn('Load sample project','load-sample','primary','','spark')}</div><div><h3>Empty workspace</h3><p class="muted small" style="margin:7px 0 14px">Clear the working project while keeping the illustrated sample library available.</p>${btn('Start empty','start-empty','','','refresh')}</div>${lastReset?btn('Undo last reset','undo-reset','ghost','','back'):''}<div class="notice">${icon('info')}Uploaded media previews and editing work locally. Specs extraction, transcription, matching examples, and AI wording suggestions are simulated. No files are sent anywhere.</div></div>`,btn('Keep exploring','close-modal','primary'),true);}
else if(type==='pdf-ready'){const f=ui.pdfFile;html=modal('Your PDF is ready.',`${f.pages} pages · ${sizeLabel(f.size)} · all selected frames together`,`<div class="notice green">${icon('check')}Your current presentation has been prepared as a real PDF.</div><p class="muted small m-top">This prototype exports visual pages. Uploaded videos stay in the app and do not become portable links in the PDF.</p>${f.warnings.length?`<div class="notice amber m-top">${icon('info')}${esc(f.warnings.join(' '))}</div>`:''}`,`${btn('Keep exploring','close-modal','ghost')}<a class="btn primary" href="${esc(f.url)}" download="${esc(f.filename)}">${icon('down',15)}Download PDF file</a>`,true);}

function addAssignment(candidateId,slotId){let a=state.assignments.find(a=>a.candidateId===candidateId&&a.slotId===slotId);if(!state.pool.includes(candidateId))state.pool.push(candidateId);if(!slotId)return;if(!a){a={id:uid('a'),candidateId,slotId,position:'Option',selection:true,shortlist:state.project.output==='Shortlist',availability:'',notes:'',overrides:{}};state.assignments.push(a);}else if(state.project.output==='Selection')a.selection=true;else a.shortlist=true;}
function saveProfile(review=false){const d=ui.profileDraft;if(!d)return;const i=state.candidates.findIndex(c=>c.id===d.id);if(i<0)return;if(review)d.reviewed=true;state.candidates[i]=clone(d);persist();closeModal();render();toast(review?'Profile information confirmed. Library status is Reviewed.':'Profile changes saved to the local cast library.');}
function resetState(sample){lastReset=clone(state);state=createState(sample);ui={...ui,nav:'workspace',step:0,tab:'library',filters:{search:'',age:'',gender:'',height:'',languages:'',skills:'',city:'',previous:'',category:''},activeSlot:null,versionId:null,slide:0,modal:null};persist(false);render();toast(sample?'Sample project loaded. Explore any step.':'Empty workspace ready. Every step is still available.');}
function generate(){if(ui.generating){gotoStep(5);return;}ui.generating=true;const deck=buildDeck();const version={id:uid('version'),deck};state.versions.push(version);ui.versionId=version.id;ui.slide=0;ui.slideFrame=0;persist(false);ui.generating=false;closeModal();gotoStep(5);toast(`Version ${deck.version} generated · ${deck.slides.length} slides, including pending requirements.`);}
async function downloadPdf(){const deck=clone(displayedDeck());toast('Preparing your PDF with all frames together…');try{const result=await CastingExport.getPdfBlob(deck);const filename=[deck.title,deck.output,'V'+deck.version].join('-').replace(/[^a-z0-9._-]+/gi,'-')+'.pdf';if(ui.pdfFile?.url)URL.revokeObjectURL(ui.pdfFile.url);ui.pdfFile={url:URL.createObjectURL(result.blob),filename,pages:result.pages,size:result.blob.size,warnings:result.warnings||[]};openModal('pdf-ready');}catch(e){toast('PDF export could not complete in this viewer. Open the downloaded HTML in your browser and try again.');console.error('PDF export',e);}}

function demoUpload(){const data=[['Samir Hassan','42','178 cm','Male','Arabic · Egyptian; English','Commercial acting; driving','Cairo','New introduction take','Featured cast'],['Salma Mourad','36','169 cm','Female','Arabic; English','Acting; presenting','Cairo','Lifestyle campaign','Lead cast'],['Tamer Khalil','27','','Male','Arabic · Egyptian','Hospitality; acting','Giza','','Featured cast']];data.forEach((r,i)=>{const id='C-'+String(++state.createdCounter).padStart(3,'0');const facts=Object.fromEntries(profileFields.map((k,n)=>[k,r[n]]));const c={id,facts,reviewed:false,frames:CastingPortraits.frames('upload-'+id,i===2?2:3),sample:true,uploaded:true,source:'Simulated video scan',mediaName:r[0].replaceAll(' ','-').toLowerCase()+'.mp4',transcript:`Fictional sample introduction: “My name is ${r[0]}. I am ${r[1]} years old and based in ${r[6]}. I speak ${r[4]}. My experience includes ${r[5]}.”`};if(i===0)c.matchId='C-014';state.candidates.push(c);state.pool.push(id);state.files.push({id:uid('file'),name:c.mediaName,kind:'video',size:'Sample video',candidateId:id,note:'Demo scan complete · Unreviewed'});});ui.tab='uploads';ui.filters={search:'',age:'',gender:'',height:'',languages:'',skills:'',city:'',previous:'',category:''};persist();render();toast('Three demo scans are now reusable as Unreviewed profiles.');}
async function readClientLogo(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(new Error('Unable to read logo'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Unable to decode logo'));img.onload=()=>{try{const cn=document.createElement('canvas'),scale=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));cn.width=Math.max(1,Math.round(img.naturalWidth*scale));cn.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=cn.getContext('2d');if(!ctx)throw new Error('Canvas unavailable');ctx.drawImage(img,0,0,cn.width,cn.height);resolve({dataUrl:cn.toDataURL('image/png'),name:file.name,width:cn.width,height:cn.height});}catch(error){reject(error);}};img.src=reader.result;};reader.readAsDataURL(file);});}
async function uploadClientLogo(file){if(!file)return;if(!/^image\/(png|jpeg|webp)$/i.test(file.type)&&!(/\.(png|jpe?g|webp)$/i.test(file.name)&&!file.type)){toast('Choose a PNG, JPG, or WebP logo. You can still continue without a logo.');return;}const project=state.project,token=++logoUploadToken;toast('Preparing the client logo…');try{const logo=await readClientLogo(file);if(project!==state.project||token!==logoUploadToken)return;state.project.clientLogo=logo;persist();render();toast('Client logo added. It will be included in newly generated presentations.');}catch(error){if(project===state.project&&token===logoUploadToken)toast('This logo could not be opened. Try another image or continue without one.');}}
async function readImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const im=new Image();im.onload=()=>{const cn=document.createElement('canvas'),scale=Math.min(1,600/Math.max(im.width,im.height));cn.width=Math.max(1,im.width*scale);cn.height=Math.max(1,im.height*scale);const ctx=cn.getContext('2d');ctx.fillStyle='#e5e5e0';ctx.fillRect(0,0,cn.width,cn.height);ctx.drawImage(im,0,0,cn.width,cn.height);resolve(cn.toDataURL('image/jpeg',.86));};im.onerror=reject;im.src=reader.result;};reader.readAsDataURL(file);});}
async function framesFromVideo(url){return new Promise(resolve=>{const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;let images=[],idx=0,times=[];const timer=setTimeout(()=>finish(),14000);function finish(){clearTimeout(timer);v.onloadedmetadata=null;v.onseeked=null;v.onerror=null;v.pause();v.removeAttribute('src');v.load();resolve(images);}v.onerror=finish;v.onloadedmetadata=()=>{if(!Number.isFinite(v.duration)||!v.videoWidth){finish();return;}times=[.15,.45,.75].map(t=>Math.min(v.duration-.02,Math.max(.01,v.duration*t)));v.currentTime=times[0];};v.onseeked=()=>{try{const canvas=document.createElement('canvas'),scale=Math.min(1,480/Math.max(v.videoWidth,v.videoHeight));canvas.width=Math.max(1,Math.round(v.videoWidth*scale));canvas.height=Math.max(1,Math.round(v.videoHeight*scale));canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);images.push(canvas.toDataURL('image/jpeg',.82));}catch(e){}idx++;if(idx<times.length)v.currentTime=times[idx];else finish();};v.src=url;});}
function sizeLabel(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';}
async function uploadSpecs(files){for(const f of files){state.brief.files.push({id:uid('spec'),name:f.name,size:sizeLabel(f.size)});if(/\.(txt|text)$/i.test(f.name)){try{state.brief.text=await f.text();}catch(e){}}}persist();render();toast('Specs added locally. Use example extraction or enter the role details yourself.');}
async function uploadCast(files){for(const f of files){const isVideo=f.type.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/i.test(f.name),isImage=f.type.startsWith('image/');if(!isVideo&&!isImage){state.files.push({id:uid('file'),name:f.name,size:sizeLabel(f.size),kind:'document',note:'Supporting file · contents not analyzed'});continue;}const id='C-'+String(++state.createdCounter).padStart(3,'0'),c={id,facts:{...blankFacts(),name:f.name.replace(/\.[^.]+$/,'').replace(/[_-]/g,' ')},reviewed:false,frames:[],sample:false,uploaded:true,source:'Local upload · name from filename',mediaName:f.name,transcript:''};const match=state.candidates.find(x=>x.facts.name.toLowerCase()===c.facts.name.toLowerCase());if(match)c.matchId=match.id;state.candidates.push(c);state.pool.push(id);const fr={id:uid('file'),name:f.name,size:sizeLabel(f.size),kind:isVideo?'video':'image',candidateId:id,note:isVideo?'Local preview · preparing sample frames':'Local image · Unreviewed'};state.files.push(fr);if(isVideo){const url=URL.createObjectURL(f),mediaKey=uid('media');c.mediaKey=mediaKey;media.set(mediaKey,{url,file:f});framesFromVideo(url).then(images=>{const target=state.candidates.find(x=>x.mediaKey===mediaKey);if(target){target.frames=images;target.source='Local video · evenly spaced preview frames';fr.note=images.length?`${images.length} local frames · no speech analysis`:'Video attached · frames unavailable';if(ui.profileDraft?.id===target.id){ui.profileDraft.frames=clone(images);ui.profileDraft.source=target.source;}persist();render();}});}else{try{c.frames=[await readImage(f)];}catch(e){fr.note='Image preview unavailable · continue or replace';}}}ui.tab='uploads';ui.nav='workspace';ui.step=2;persist();render();toast('Files added. Profiles are Unreviewed; edit their facts or continue without them.');}
function bindChange(el){const key=el.dataset.field;if(!key)return;const value=el.type==='checkbox'?el.checked:el.value;if(key.startsWith('project.')){state.project[key.split('.')[1]]=value;persist();return;}if(key==='brief.text'){state.brief.text=value;persist();return;}if(key.startsWith('filters.')){ui.filters[key.split('.')[1]]=value;if(el.id==='candidate-search'){const results=$('#candidate-results');if(results){const list=filteredCandidates(ui.nav==='library');results.innerHTML=list.length?`<div class="cards">${list.map(candidateCard).join('')}</div>`:empty('No matching candidates','Change or clear the filters to see more profiles.',btn('Clear filters','clear-filters'));}}else{const focusKey=key,pos=el.selectionStart;render();const input=document.querySelector(`[data-field="${focusKey}"]`);input?.focus();if(pos!=null)try{input.setSelectionRange(pos,pos);}catch(e){}}return;}if(key.startsWith('profile.')){if(ui.profileDraft)ui.profileDraft.facts[key.split('.')[1]]=value;return;}if(key.startsWith('role.')){if(ui.roleDraft)ui.roleDraft[key.split('.')[1]]=value;return;}if(key.startsWith('assignment.')){const a=state.assignments.find(x=>x.id===el.dataset.id);if(a){a[key.split('.')[1]]=value;persist();if(el.type==='checkbox')render();}return;}if(key.startsWith('wording.')){if(ui.assignDraft)ui.assignDraft[key.split('.')[1]]=value;return;}if(key==='version'){ui.versionId=value;ui.slide=0;ui.slideFrame=0;render();}}
async function action(el){const a=el.dataset.action,id=el.dataset.id;if(!a)return;switch(a){

case 'logo-placement':state.project.logoPlacement=el.dataset.value==='all'?'all':'cover';persist();render();break;
case 'choose-spec':$('#spec-files').click();break;
case 'remove-spec':state.brief.files.splice(Number(el.dataset.index),1);persist();render();break;
case 'scan-specs':exampleScan();break;
case 'add-role':ui.roleDraft={name:'',count:1,age:'',gender:'',scene:'',category:'',appearance:'',languages:'',skills:'',shootDates:'',location:'',availability:'',instructions:''};openModal('role');break;
case 'edit-role':ui.roleDraft=clone(state.roles.find(r=>r.id===id));if(ui.roleDraft)openModal('role',id);break;
case 'save-role':{const d=ui.roleDraft;d.count=Math.max(0,Math.floor(Number(d.count)||0));if(!d.name)d.name='Unnamed role';if(d.id){const i=state.roles.findIndex(r=>r.id===d.id);state.roles[i]=clone(d);}else{d.id=uid('role');state.roles.push(clone(d));}persist();closeModal();render();toast('Role saved. Its individual casting slots are ready.');break;}
case 'remove-role':state.roles=state.roles.filter(r=>r.id!==id);persist();closeModal();render();toast('Role removed from this workspace. Candidate profiles are kept.');break;
case 'candidate-tab':ui.tab=el.dataset.tab;render();break;
case 'show-library':ui.tab='library';ui.filters={search:'',age:'',gender:'',height:'',languages:'',skills:'',city:'',previous:'',category:''};render();break;
case 'toggle-filters':ui.filterOpen=!ui.filterOpen;render();break;
case 'clear-filters':Object.keys(ui.filters).forEach(k=>ui.filters[k]='');render();break;
case 'suggest-filters':{const s=activeSlot();if(s){ui.filters={search:'',age:s.role.age||'',gender:s.role.gender==='Any'?'':s.role.gender||'',height:'',languages:'',skills:'',city:'',previous:'',category:s.role.category||''};ui.filterOpen=true;render();toast('Suggested filters from '+s.name+'. Adjust any field.');}else{ui.filterOpen=true;render();toast('No role requirements yet. You can set the filters yourself.');}break;}
case 'choose-cast':$('#cast-files').click();break;
case 'demo-upload':demoUpload();break;
case 'profile':openProfile(id);break;
case 'save-profile':saveProfile(false);break;
case 'confirm-profile-draft':saveProfile(true);break;
case 'confirm-profile':{const c=cand(id);if(c){c.reviewed=true;persist();render();toast(c.facts.name+' marked Reviewed.');}break;}
case 'profile-frame':ui.profileFrame=Number(el.dataset.index);renderModal();break;
case 'remove-frame':if(ui.profileDraft?.frames.length){ui.profileDraft.frames.splice(ui.profileFrame,1);ui.profileFrame=0;renderModal();}else toast('No frames to remove. You can still continue.');break;
case 'cover-frame':if(ui.profileDraft?.frames.length){const [f]=ui.profileDraft.frames.splice(ui.profileFrame,1);ui.profileDraft.frames.unshift(f);ui.profileFrame=0;renderModal();toast('This image will appear first in the carousel.');}break;
case 'choose-frames':activeFileTarget=ui.profileDraft?.id;$('#frame-files').click();break;
case 'choose-replace-video':activeFileTarget=id||ui.profileDraft?.id;$('#replace-video').click();break;
case 'assign-open':openModal('assign',id);break;
case 'save-assign':{const picks=[...document.querySelectorAll('[data-field="assign-slot"]:checked')].map(x=>x.value);if(!state.pool.includes(id))state.pool.push(id);state.assignments=state.assignments.filter(a=>a.candidateId!==id||picks.includes(a.slotId));for(const s of picks){if(!state.assignments.some(a=>a.candidateId===id&&a.slotId===s))addAssignment(id,s);}persist();closeModal();render();toast(picks.length?`Assignments updated for ${picks.length} slot${picks.length===1?'':'s'}. New choices start as Option.`:'Candidate kept in your workspace. Assign whenever you are ready.');break;}
case 'slot':ui.activeSlot=id;render();break;
case 'pick-for-slot':openModal('pick',el.dataset.slot);break;
case 'quick-assign':addAssignment(id,el.dataset.slot);persist();render();toast('Candidate added as an Option.');break;
case 'library-for-slot':ui.activeSlot=el.dataset.slot;closeModal();ui.tab='library';gotoStep(2);break;
case 'position':{const ass=state.assignments.find(x=>x.id===id);if(ass){ass.position=el.dataset.value;persist();render();}break;}
case 'remove-assignment':state.assignments=state.assignments.filter(a=>a.id!==id);persist();render();toast('Removed from this slot. The library profile is kept.');break;
case 'video':{const snap=el.dataset.snapshot==='true'?clone(displayedDeck().slides[ui.slide]):null;openModal('video',id);if(snap){ui.modal.snapshot=snap;renderModal();}break;}
case 'sample-play':{const transcript=$('#transcript-box');if(transcript){transcript.style.borderColor='var(--green)';transcript.scrollIntoView({behavior:'smooth',block:'nearest'});}toast('Sample interview: read the fictional transcript below, or attach a real video to play.');break;}
case 'wording':{const ass=state.assignments.find(x=>x.id===id),c=cand(ass?.candidateId);if(ass&&c){ui.assignDraft={skills:ass.overrides?.skills??c.facts.skills,previous:ass.overrides?.previous??c.facts.previous,notes:ass.overrides?.notes??ass.notes};ui.suggestion=null;openModal('wording',id);}break;}
case 'suggest-wording':{const concise=s=>{if(s.length<=160)return s;let text=s.split(/[.;]\s/).slice(0,2).join('; ');if(text.length>160)text=text.slice(0,147).replace(/\s+\S*$/,'')+'…';return text;};ui.suggestion=Object.fromEntries(Object.entries(ui.assignDraft).map(([k,v])=>[k,concise(v)]));renderModal();break;}
case 'accept-suggestion':ui.assignDraft=clone(ui.suggestion);ui.suggestion=null;renderModal();toast('Suggested wording applied to the editor. Review before saving.');break;
case 'reset-wording':{const ass=state.assignments.find(x=>x.id===ui.modal.id),c=cand(ass.candidateId);ui.assignDraft={skills:c.facts.skills,previous:c.facts.previous,notes:ass.notes};ui.suggestion=null;renderModal();break;}
case 'save-wording':{const ass=state.assignments.find(x=>x.id===ui.modal.id);ass.overrides=clone(ui.assignDraft);persist();closeModal();render();toast('Slide wording saved. Full library facts are retained.');break;}
case 'duplicate':openModal('duplicate',id);break;
case 'keep-new-profile':delete cand(id).matchId;persist();closeModal();render();toast('Kept as a separate Unreviewed profile.');break;
case 'link-existing':{const fresh=cand(id),old=cand(fresh?.matchId);if(fresh&&old){old.previousMaterial=old.previousMaterial||[];old.previousMaterial.push({frames:old.frames,mediaName:old.mediaName});old.frames=clone(fresh.frames);old.mediaName=fresh.mediaName;old.transcript=fresh.transcript;old.reviewed=false;old.sample=fresh.sample;old.source='New material linked by producer';old.mediaKey=fresh.mediaKey||'';state.pool=Array.from(new Set(state.pool.map(x=>x===id?old.id:x)));const occupied=new Set(state.assignments.filter(a=>a.candidateId===old.id).map(a=>a.slotId));state.assignments=state.assignments.filter(a=>!(a.candidateId===id&&occupied.has(a.slotId)));state.assignments.forEach(a=>{if(a.candidateId===id)a.candidateId=old.id;});state.files.forEach(f=>{if(f.candidateId===id)f.candidateId=old.id;});state.candidates=state.candidates.filter(c=>c.id!==id);persist();closeModal();render();toast('New material linked to the existing profile. Existing candidate facts are retained.');}break;}
case 'generate':generate();break;
case 'download-pdf':await downloadPdf();break;
case 'pdf-mode':ui.pdfMode=el.dataset.value==='true';render();break;
case 'slide':ui.slide=Number(el.dataset.index);ui.slideFrame=0;render();break;
case 'slide-next':ui.slide=(ui.slide+1)%displayedDeck().slides.length;ui.slideFrame=0;render();break;
case 'slide-prev':ui.slide=(ui.slide-1+displayedDeck().slides.length)%displayedDeck().slides.length;ui.slideFrame=0;render();break;
case 'frame-next':{const n=displayedDeck().slides[ui.slide].frames?.length||1;ui.slideFrame=(ui.slideFrame+1)%n;render();break;}
case 'frame-prev':{const n=displayedDeck().slides[ui.slide].frames?.length||1;ui.slideFrame=(ui.slideFrame-1+n)%n;render();break;}
case 'open-version':ui.versionId=id;ui.slide=0;gotoStep(5);break;
case 'jump-slot':{const slot=allSlots().find(s=>s.name===el.dataset.slotName);ui.activeSlot=slot?.id||null;gotoStep(3);break;}
case 'planned':toast(el.dataset.name+' is shown as a future presentation type. Casting is the testable flow.');break;
}}
let eventTarget=null;
document.addEventListener('click',e=>{eventTarget=e.target;const el=e.target.closest('[data-action]');if(el)action(el);});
document.addEventListener('input',e=>{if(e.target.matches('[data-field]')&&e.target.type!=='checkbox'&&e.target.tagName!=='SELECT')bindChange(e.target);});
document.addEventListener('change',e=>{if(e.target.matches('[data-field]')&&(e.target.type==='checkbox'||e.target.tagName==='SELECT'))bindChange(e.target);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal();if(e.key==='Tab'&&ui.modal){const nodes=[...$('#overlay').querySelectorAll('button,input,select,textarea,[tabindex="0"]')].filter(n=>!n.disabled);if(nodes.length){if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){e.preventDefault();nodes[0].focus();}}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();action(e.target);}if(ui.step===5&&!ui.modal&&!e.target.matches('input,textarea,select')){if(e.key==='ArrowRight')action({dataset:{action:'slide-next'}});if(e.key==='ArrowLeft')action({dataset:{action:'slide-prev'}});}});
document.addEventListener('dragover',e=>{const z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.add('drag');}});
document.addEventListener('dragleave',e=>{e.target.closest('[data-drop]')?.classList.remove('drag');});
document.addEventListener('drop',e=>{const z=e.target.closest('[data-drop]');if(z){e.preventDefault();z.classList.remove('drag');const files=[...e.dataTransfer.files];if(z.dataset.drop==='spec')uploadSpecs(files);else uploadCast(files);}});
$('#logo-file').addEventListener('change',async e=>{const file=e.target.files[0];e.target.value='';await uploadClientLogo(file);});
$('#spec-files').addEventListener('change',async e=>{await uploadSpecs([...e.target.files]);e.target.value='';});
$('#cast-files').addEventListener('change',async e=>{await uploadCast([...e.target.files]);e.target.value='';});
$('#frame-files').addEventListener('change',async e=>{const id=activeFileTarget;const imgs=[];for(const f of [...e.target.files]){try{imgs.push(await readImage(f));}catch(err){}}if(ui.profileDraft?.id===id){ui.profileDraft.frames.push(...imgs);ui.profileDraft.sample=false;renderModal();}else{const c=cand(id);if(c){c.frames.push(...imgs);c.sample=false;persist();render();}}e.target.value='';toast(imgs.length+' photos added. Save the profile to keep your selection.');});
$('#replace-video').addEventListener('change',async e=>{const f=e.target.files[0],id=activeFileTarget;if(!f||!id)return;const c=cand(id);if(!c)return;const url=URL.createObjectURL(f),mediaKey=uid('media');media.set(mediaKey,{url,file:f});c.mediaKey=mediaKey;c.mediaName=f.name;c.sample=false;c.reviewed=false;c.source='Local video · frames being prepared';c.transcript='';if(ui.profileDraft?.id===id){ui.profileDraft.mediaKey=mediaKey;ui.profileDraft.mediaName=f.name;ui.profileDraft.sample=false;ui.profileDraft.reviewed=false;ui.profileDraft.transcript='';}persist();render();toast('Video attached. Preparing three local preview frames…');const imgs=await framesFromVideo(url);const live=state.candidates.find(x=>x.mediaKey===mediaKey);if(live){live.frames=imgs;live.source='Local video · evenly spaced preview frames';if(ui.profileDraft?.id===live.id){ui.profileDraft.frames=clone(imgs);ui.profileDraft.source=live.source;}persist();render();toast(imgs.length?imgs.length+' preview frames prepared. No speech analysis runs in this prototype.':'The video is attached. Continue without frames or add photos.');}e.target.value='';});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}});
// Small public inspection surface for deterministic verification; no network or account access.
window.CastingPrototype={getState:()=>clone(state),getUI:()=>({...ui,profileDraft:undefined}),buildDeck:()=>clone(buildDeck()),reset:sample=>resetState(Boolean(sample)),goTo:gotoStep,save:()=>persist(false)};
render();
})();
