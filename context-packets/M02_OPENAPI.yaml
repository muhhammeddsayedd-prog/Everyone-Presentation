        requirements:
          $ref: '#/components/schemas/RoleRequirements'
        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/Clarification'
        sort_order:
          type: integer
          minimum: 0
        row_version:
          $ref: '#/components/schemas/RowVersion'
        archived:
          type: boolean
      required:
      - id
      - workspace_id
      - name
      - headcount
      - category
