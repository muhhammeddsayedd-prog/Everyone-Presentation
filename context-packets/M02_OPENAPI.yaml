        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/Clarification'
      required:
      - row_version
    Spec:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        workspace_id:
          $ref: '#/components/schemas/Id'
        source_asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        source_text:
          $ref: '#/components/schemas/NullableText'
        normalized_instructions:
          $ref: '#/components/schemas/NullableText'
        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/Clarification'
        row_version:
          $ref: '#/components/schemas/RowVersion'
        processing_job_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - id
      - workspace_id
      - source_asset_id
      - source_text
      - normalized_instructions
      - clarifications
      - row_version
      - processing_job_id
    SpecSubmit:
      type: object
      additionalProperties: false
      properties:
        source_asset_id:
          $ref: '#/components/schemas/Id'
        source_text:
          type: string
        row_version:
          $ref: '#/components/schemas/RowVersion'
          description: Current Spec.row_version, not the workspace version. Omission is accepted only for a locked
            pristine initial Spec; other source submissions require its current version.
      required: []
      description: Exactly one of source_asset_id or source_text is required. Existing initial record may be corrected,
        not versioned as a specs revision product.
      oneOf:
      - required:
        - source_asset_id
        not:
          required:
          - source_text
      - required:
        - source_text
        not:
          required:
          - source_asset_id
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Scoped to actor+operation; replay same body returns original response; different body returns
        409.
