components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      description: Verified acting-user access token. Issuer/audience/auth integration established in M00; never
        use service_role in browser/MCP client.
    ReviewToken:
      type: apiKey
      in: header
      name: X-Review-Token
      description: Raw expiring bearer review token only for initial exchange. Never log.
    ReviewSession:
      type: apiKey
      in: header
      name: X-Review-Session
      description: Short-lived session scoped to one link/series; server verifies link live for every request. Cookie
        adapter may be used by browser.
    MediaGrant:
      type: apiKey
      in: header
      name: X-Media-Grant
      description: Secret embedded in private external PDF, bound to one export and fixed version; parent link live-view
        grant required.
    ServiceBearer:
      type: http
      scheme: bearer
      description: Narrow service identity plus per-job lease token; not an internal user token.
  schemas:
    JobEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/Id'
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        stage:
          type: string
        sequence:
          type: integer
          minimum: 1
        event_type:
          type: string
          enum:
          - heartbeat
          - progress
          - succeeded
          - failed
        input_hash:
          type: string
        result_schema:
          $ref: '#/components/schemas/NullableText'
        result:
          type: object
          additionalProperties: true
          description: Validated by the allowlisted job/stage result schema. prepare_document uses contracts/json-schema/document-preparation.schema.json;
            source_asset_id is null only for direct pasted text, while real files require their verified asset ID.
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - event_id
      - job_id
      - attempt_id
      - lease_token
      - stage
      - sequence
      - event_type
      - input_hash
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
      required:
      - code
      - message
      - details
      - retryable
    NullableText:
      anyOf:
      - type: string
      - type: 'null'
    Id:
      type: string
      minLength: 1
      maxLength: 200
      description: Opaque resource identifier. Do not parse business meaning or assume source database PK type.
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
        error:
          $ref: '#/components/schemas/Error'
      required:
      - request_id
      - error
    Warning:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        entity_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - code
      - message
      - entity_id
    JobEventReceipt:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/Id'
        applied:
          type: boolean
        duplicate:
          type: boolean
        stale:
          type: boolean
        job_status:
          type: string
      required:
      - event_id
      - applied
      - duplicate
      - stale
      - job_status
    ServiceStageClaim:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        stage:
          type: string
        input_hash:
          type: string
        workflow_execution_id:
          type: string
      required:
      - job_id
      - stage
      - input_hash
    ServiceStageLease:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        stage:
          type: string
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        lease_expires_at:
          $ref: '#/components/schemas/DateTime'
        already_completed:
          type: boolean
        input:
          type: object
          additionalProperties: true
      required:
      - job_id
      - stage
      - attempt_id
      - lease_token
      - lease_expires_at
      - already_completed
      - input
    DateTime:
      type: string
      format: date-time
    JobAssetAccess:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        asset_id:
          $ref: '#/components/schemas/Id'
        access:
          type: string
          enum:
          - read
          - write
          default: read
          description: Lease-scoped exact-object access. Write is only a newly reserved immutable output, never
            an original.
      required:
      - job_id
      - attempt_id
      - lease_token
      - asset_id
    ServiceAssetAccess:
      type: object
      additionalProperties: false
      description: Private service-only transfer capability. Headers are credentials and must not enter URLs, ordinary
        job metadata, logs or n8n envelopes. Exact object, method and lifetime are lease-bound; no arbitrary destination/signing
        interface exists.
      properties:
        asset_id:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
          - GET
          - POST
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '#/components/schemas/DateTime'
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - asset_id
      - url
      - method
      - headers
      - expires_at
      - mime_type
      - size_bytes
      - sha256
    JobOutputComplete:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        asset_id:
          $ref: '#/components/schemas/Id'
        sha256:
          type: string
        actual_size_bytes:
          type: integer
          minimum: 1
        width:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        height:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - job_id
      - attempt_id
      - lease_token
      - asset_id
      - sha256
      - actual_size_bytes
      - width
      - height
      - duration_ms
    MediaAsset:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          type: string
          enum:
          - specs
          - candidate_video
          - candidate_support
          - client_logo
          - candidate_frame
          - audio
          - transcript
          - preview_video
          - presentation_pdf
          - presentation_preview
          - presentation_manifest
          - document_text
          - document_page
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          anyOf:
          - type: string
          - type: 'null'
        status:
          type: string
          enum:
          - uploading
          - ready
          - failed
          - quarantined
          - archived
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        width:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        height:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        source_asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        source_timestamp_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - purpose
      - filename
      - mime_type
      - size_bytes
      - sha256
      - status
      - duration_ms
      - width
      - height
      - source_asset_id
      - source_timestamp_ms
      - created_at
    JobOutputReservation:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        output_key:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Stable logical output name within this job attempt. Retries with the same key and metadata
            reuse the same immutable reservation; conflicting metadata is rejected.
        asset_kind:
          type: string
          enum:
          - audio_derivative
          - frame
          - preview_video
          - transcript
          - presentation_pdf
          - presentation_preview
          - presentation_manifest
          - document_text
          - document_page
        filename:
          type: string
        mime_type:
          type: string
        expected_size_bytes:
          type: integer
          minimum: 1
        parent_asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        time_offset_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - job_id
      - attempt_id
      - lease_token
      - output_key
      - asset_kind
      - filename
      - mime_type
      - expected_size_bytes
      - parent_asset_id
      - time_offset_ms
    JobOutputReservationResult:
      type: object
      additionalProperties: false
      description: Actual immutable derivative reservation plus a lease-bound transfer capability. This is a direct
        new-object POST, not a signed-upload PUT or an upsert grant.
      properties:
        asset:
          $ref: '#/components/schemas/MediaAsset'
        access:
          $ref: '#/components/schemas/ServiceAssetAccess'
      required:
      - asset
      - access
    JobMutation:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        reason:
          $ref: '#/components/schemas/NullableText'
      required:
      - row_version
    RowVersion:
      type: integer
      minimum: 1
      description: Optimistic version from the last read of the mutated resource; stale write returns 409.
    Job:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        workspace_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        kind:
          type: string
          enum:
          - specs_extract
          - candidate_scan
          - frame_extract
          - ai_suggestion
          - presentation_render
          - presentation_export
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_for_input
          - succeeded
          - failed
          - cancelled
        stage:
          type: string
        attempt:
          type: integer
          minimum: 0
        progress_completed:
          type: integer
          minimum: 0
        progress_total:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        batch_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        input_asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        resource_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/DateTime'
        updated_at:
          $ref: '#/components/schemas/DateTime'
        row_version:
          $ref: '#/components/schemas/RowVersion'
      required:
      - id
      - workspace_id
      - kind
      - status
      - stage
      - attempt
      - progress_completed
      - progress_total
      - batch_id
      - input_asset_id
      - resource_id
      - error
      - created_at
      - updated_at
      - row_version
    JobAccepted:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        resource_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        poll_url:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - waiting_for_input
          - succeeded
          - failed
          - cancelled
          description: Recorded durable job status for this acknowledgement. Reusing an existing job reports its
            current status; an idempotent replay may retain its original acknowledgement. Read poll_url for current
            status.
      required:
      - job_id
      - resource_id
      - poll_url
      - status
    Page:
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - next_cursor
    Playback:
      type: object
      additionalProperties: false
      properties:
        asset_id:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri
        expires_at:
          $ref: '#/components/schemas/DateTime'
        mime_type:
          type: string
        source_version_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - asset_id
      - url
      - expires_at
      - mime_type
      - source_version_id
    Success:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        affected_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - success
      - affected_ids
    CompleteUpload:
      type: object
      additionalProperties: false
      properties:
        sha256:
          type: string
        actual_size_bytes:
          type: integer
          minimum: 1
        start_processing:
          type: boolean
          default: true
      required:
      - actual_size_bytes
      - start_processing
    UploadCompletion:
      type: object
      additionalProperties: false
      properties:
        asset:
          $ref: '#/components/schemas/MediaAsset'
        processing_job_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        status:
          type: string
          enum:
          - ready
          - queued
      required:
      - asset
      - processing_job_id
      - status
    UploadSession:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        asset_id:
          $ref: '#/components/schemas/Id'
        protocol:
          type: string
          enum:
          - tus
          - signed_put
        upload_url:
          description: A scoped transfer URL for an open session. Closed sessions return null and empty upload_headers.
          anyOf:
          - type: string
            format: uri
          - type: 'null'
        upload_headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '#/components/schemas/DateTime'
        status:
          type: string
          enum:
          - open
          - completed
          - cancelled
          - expired
        maximum_bytes:
          type: integer
          minimum: 1
      required:
      - id
      - asset_id
      - protocol
      - upload_url
      - upload_headers
      - expires_at
      - status
      - maximum_bytes
      allOf:
      - if:
          properties:
            status:
              const: open
        then:
          properties:
            upload_url:
              type: string
        else:
          properties:
            upload_url:
              type: 'null'
            upload_headers:
              maxProperties: 0
    UploadSessionCreate:
      type: object
      additionalProperties: false
      properties:
        workspace_id:
          $ref: '#/components/schemas/Id'
        candidate_id:
          $ref: '#/components/schemas/Id'
        batch_id:
          $ref: '#/components/schemas/Id'
        purpose:
          type: string
          enum:
          - specs
          - candidate_video
          - candidate_support
          - client_logo
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          type: string
      required:
      - purpose
      - filename
      - mime_type
      - size_bytes
    SlotPatch:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        label:
          type: string
      required:
      - row_version
      - label
    Slot:
