components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      description: Verified acting-user access token. Issuer/audience/auth integration established in M00; never
        use service_role in browser/MCP client.
    ReviewToken:
      type: apiKey
      in: header
      name: X-Review-Token
      description: Raw expiring bearer review token only for initial exchange. Never log.
    ReviewSession:
      type: apiKey
      in: header
      name: X-Review-Session
      description: Short-lived session scoped to one link/series; server verifies link live for every request. Cookie
        adapter may be used by browser.
    MediaGrant:
      type: apiKey
      in: header
      name: X-Media-Grant
      description: Secret embedded in private external PDF, bound to one export and fixed version; parent link live-view
        grant required.
    ServiceBearer:
      type: http
      scheme: bearer
      description: Narrow service identity plus per-job lease token; not an internal user token.
  schemas:
    SettingsPatch:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        default_timezone:
          type: string
        template_version:
          type: string
      required:
      - row_version
    RowVersion:
      type: integer
      minimum: 1
      description: Optimistic version from the last read of the mutated resource; stale write returns 409.
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
        error:
          $ref: '#/components/schemas/Error'
      required:
      - request_id
      - error
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
      required:
      - code
      - message
      - details
      - retryable
    Warning:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        entity_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - code
      - message
      - entity_id
    Id:
      type: string
      minLength: 1
      maxLength: 200
      description: Opaque resource identifier. Do not parse business meaning or assume source database PK type.
    Settings:
      type: object
      additionalProperties: false
      properties:
        template_version:
          type: string
        default_timezone:
          type: string
        default_review_expiry_days:
          type: integer
          const: 30
        models:
          type: object
          additionalProperties:
            type: string
        row_version:
          $ref: '#/components/schemas/RowVersion'
      required:
      - template_version
      - default_timezone
      - default_review_expiry_days
      - models
      - row_version
    ArchiveRequest:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        reason:
          $ref: '#/components/schemas/NullableText'
      required:
      - row_version
    NullableText:
      anyOf:
      - type: string
      - type: 'null'
    Success:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        affected_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - success
      - affected_ids
    AudiencePresetPatch:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        label:
          type: string
        settings:
          type: object
          additionalProperties: false
          properties: {}
          required: []
      required:
      - row_version
    AudiencePreset:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        key:
          type: string
        label:
          type: string
        scope:
          type: string
          enum:
          - internal
          - external
        settings:
          type: object
          additionalProperties: false
          properties: {}
          required: []
        archived:
          type: boolean
        row_version:
          $ref: '#/components/schemas/RowVersion'
      required:
      - id
      - key
      - label
      - scope
      - settings
      - archived
      - row_version
    AudiencePresetCreate:
      type: object
      additionalProperties: false
      properties:
        key:
          type: string
        label:
          type: string
        scope:
          type: string
          enum:
          - internal
          - external
        settings:
          type: object
          additionalProperties: false
          properties: {}
          required: []
      required:
      - label
      - scope
      - settings
    Page:
      type: object
      additionalProperties: false
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - next_cursor
    Playback:
      type: object
      additionalProperties: false
      properties:
        asset_id:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri
        expires_at:
          $ref: '#/components/schemas/DateTime'
        mime_type:
          type: string
        source_version_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - asset_id
      - url
      - expires_at
      - mime_type
      - source_version_id
    DateTime:
      type: string
      format: date-time
    MediaAsset:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          type: string
          enum:
          - specs
          - candidate_video
          - candidate_support
          - client_logo
          - candidate_frame
          - audio
          - transcript
          - preview_video
          - presentation_pdf
          - presentation_preview
          - presentation_manifest
          - document_text
          - document_page
        filename:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        sha256:
          anyOf:
          - type: string
          - type: 'null'
