      - pending_slide_count
      - issues
      - can_generate
      - unreviewed_candidate_ids
    ReviewIssue:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        severity:
          type: string
          enum:
          - information
          - warning
          - blocking
        entity_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        field:
          $ref: '#/components/schemas/NullableText'
        message:
          type: string
        repair_action:
          $ref: '#/components/schemas/NullableText'
      required:
      - code
      - severity
      - entity_id
      - field
      - message
      - repair_action
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Scoped to actor+operation; replay same body returns original response; different body returns
        409.
