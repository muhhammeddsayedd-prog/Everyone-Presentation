      additionalProperties: false
      properties:
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - next_cursor
    PdfDownload:
      type: object
      additionalProperties: false
      properties:
        version_id:
          $ref: '#/components/schemas/Id'
        download_url:
          type: string
          format: uri
        expires_at:
          $ref: '#/components/schemas/DateTime'
        filename:
          type: string
        size_bytes:
          type: integer
          minimum: 0
      required:
      - version_id
      - download_url
      - expires_at
      - filename
      - size_bytes
    PresentationVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        series_id:
          $ref: '#/components/schemas/Id'
        version_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - queued
          - rendering
          - ready
          - failed
        input_draft_revision:
          type: integer
          minimum: 0
        input_fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        template_version:
          type: string
        manifest_hash:
          type: string
        slides:
          type: array
          items:
            $ref: '#/components/schemas/VersionSlide'
        pdf_asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/DateTime'
        ready_at:
          anyOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        generation_job_id:
          $ref: '#/components/schemas/Id'
      required:
      - id
      - series_id
      - version_no
      - status
      - input_draft_revision
      - input_fingerprint
      - template_version
      - manifest_hash
      - slides
      - pdf_asset_id
      - created_at
      - ready_at
      - generation_job_id
    VersionSlide:
      type: object
