            schema:
              $ref: '#/components/schemas/ReviewLinkCreate'
      description: External-audience series only. A link may be created before Ready output; its guest viewer then
        shows Preparing. Default expiry is exactly30 days and is not renewed by generation. Raw bearer returned
        only on create/rotation; encrypted exact creation replay retained24h and cleaned on later token operations.
