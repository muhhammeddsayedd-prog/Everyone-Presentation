openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Everyone Presentation Studio API — M06 implementation subset
  version: 1.0.0-design
  description: Design contract, not a deployed API. UI, API, MCP and workflow callbacks use shared domain operations.
    Database discovery may adapt physical storage without changing agreed product semantics. IDs are opaque. All
    internal endpoints enforce capability AND project/library scope. Missing facts/open slots are allowed; invalid
    access/integrity/render data is not.
servers:
- url: /api/v1
  description: Same-origin versioned API
paths:
  /versions/{version_id}:
    get:
      operationId: get_version
      summary: Read fixed version manifest and ordered slides
      tags:
      - versions
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  request_id:
                    type: string
                  data:
                    $ref: '#/components/schemas/PresentationVersion'
                  warnings:
                    type: array
                    items:
                      $ref: '#/components/schemas/Warning'
                required:
                - request_id
                - data
        '400':
          description: Malformed input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Required capability or scope absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found in accessible scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Stale version, idempotency mismatch, or business constraint conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Valid request structure with invalid domain/media state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit; inspect Retry-After
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporary dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-capability: workspaces.read
      x-mcp-exposed: true
      x-shared-service-operation: get_version
      security:
      - InternalBearer: []
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
