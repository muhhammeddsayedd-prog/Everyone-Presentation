          type: string
          format: uri
        token:
          type: string
          description: Returned once. Treat as a bearer secret; never log it.
      required:
      - link
      - url
      - token
    ReviewLink:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        series_id:
          $ref: '#/components/schemas/Id'
        label:
          type: string
        expires_at:
          $ref: '#/components/schemas/DateTime'
        download_enabled:
          type: boolean
        revoked_at:
          anyOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        latest_ready_version_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        row_version:
          $ref: '#/components/schemas/RowVersion'
        created_at:
          $ref: '#/components/schemas/DateTime'
      required:
      - id
      - series_id
      - label
      - expires_at
      - download_enabled
      - revoked_at
      - latest_ready_version_id
      - row_version
      - created_at
    ReviewLinkPatch:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        label:
          type: string
          maxLength: 160
        expires_at:
          $ref: '#/components/schemas/DateTime'
        download_enabled:
          type: boolean
      required:
      - row_version
    ReviewLinkCreate:
      type: object
      additionalProperties: false
      properties:
        series_id:
          $ref: '#/components/schemas/Id'
        label:
          type: string
          maxLength: 160
        expires_at:
          $ref: '#/components/schemas/DateTime'
        download_enabled:
          type: boolean
          default: true
      required:
      - series_id
    PresentationVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        series_id:
          $ref: '#/components/schemas/Id'
        version_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - queued
          - rendering
          - ready
          - failed
        input_draft_revision:
          type: integer
          minimum: 0
        input_fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        template_version:
          type: string
        manifest_hash:
          type: string
          pattern: ^[a-f0-9]{64}$
        slides:
          type: array
          items:
            $ref: '#/components/schemas/VersionSlide'
          minItems: 2
          maxItems: 1000
        pdf_asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/DateTime'
        ready_at:
          anyOf:
          - $ref: '#/components/schemas/DateTime'
          - type: 'null'
        generation_job_id:
          $ref: '#/components/schemas/Id'
        manifest_asset_id:
          anyOf:
          - &id006
            $ref: '#/components/schemas/Id'
          - type: 'null'
        generated_by: *id006
        failure_code:
          anyOf:
          - type: string
            pattern: ^[A-Z][A-Z0-9_]{0,99}$
          - type: 'null'
        render_context:
          $ref: '#/components/schemas/PresentationRenderContext'
      required:
      - id
      - series_id
      - version_no
      - status
      - input_draft_revision
      - input_fingerprint
      - template_version
      - manifest_hash
      - slides
      - pdf_asset_id
      - created_at
      - ready_at
      - generation_job_id
      - manifest_asset_id
      - generated_by
      - failure_code
      - render_context
      description: Internal fixed-version projection. All content and render_context derive from its immutable snapshot;
        no private storage destinations or live library values are returned. Ready requires both manifest and PDF
        assets.
    PresentationRenderContext:
      type: object
      additionalProperties: false
      properties:
        cover:
          $ref: '#/components/schemas/ReviewCover'
        template:
          $ref: '#/components/schemas/TemplateIdentity'
        slide_contexts:
          type: array
          minItems: 2
          maxItems: 1000
          items:
            $ref: '#/components/schemas/PresentationSlideContext'
      required:
      - cover
      - template
      - slide_contexts
    PresentationSlideContext:
      type: object
      additionalProperties: false
      properties:
        slide_id: &id007
          $ref: '#/components/schemas/Id'
        role_id:
          anyOf:
          - *id007
          - type: 'null'
        slot_id:
          anyOf:
          - *id007
          - type: 'null'
        provisional:
          type: boolean
        review_status:
          anyOf:
          - type: string
            enum:
            - reviewed
            - unreviewed
          - type: 'null'
        frames:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/ReviewFrame'
      required:
      - slide_id
      - role_id
      - slot_id
      - provisional
      - review_status
      - frames
    ReviewFrame:
      type: object
      additionalProperties: false
      properties:
        asset_id: &id008
          $ref: '#/components/schemas/Id'
        source_asset_id: *id008
        timestamp_ms:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - asset_id
      - source_asset_id
      - timestamp_ms
      - width
      - height
      - sha256
    TemplateIdentity:
      type: object
      additionalProperties: false
      properties:
        key: &id009
          $ref: '#/components/schemas/Id'
        version: *id009
        content_sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        font_key: *id009
      required:
      - key
      - version
      - content_sha256
      - font_key
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Scoped to actor+operation; replay same body returns original response; different body returns
        409.
    OptionalIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Optional exact-response replay for an uncertain mutation acknowledgement. A repeated key must
        keep the identical semantic request; current authority is rechecked.
