          $ref: '#/components/schemas/DateTime'
        download_enabled:
          type: boolean
          default: true
      required:
      - series_id
    PresentationVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        series_id:
          $ref: '#/components/schemas/Id'
        version_no:
          type: integer
          minimum: 1
        status:
          type: string
          enum:
          - queued
          - rendering
