      - id
      - series_id
      - version_no
      - status
      - input_draft_revision
      - input_fingerprint
      - template_version
      - manifest_hash
      - slides
      - pdf_asset_id
      - created_at
      - ready_at
      - generation_job_id
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Scoped to actor+operation; replay same body returns original response; different body returns
        409.
