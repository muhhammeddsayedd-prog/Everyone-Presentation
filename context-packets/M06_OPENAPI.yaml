components:
  securitySchemes:
    InternalBearer:
      type: http
      scheme: bearer
      description: Verified acting-user access token. Issuer/audience/auth integration established in M00; never
        use service_role in browser/MCP client.
    ReviewToken:
      type: apiKey
      in: header
      name: X-Review-Token
      description: Raw expiring bearer review token only for initial exchange. Never log.
    ReviewSession:
      type: apiKey
      in: header
      name: X-Review-Session
      description: Short-lived session scoped to one link/series; server verifies link live for every request. Cookie
        adapter may be used by browser. Browser uses the documented scoped HttpOnly cookie adapter; raw credentials
        are never stored in browser localStorage/sessionStorage.
    MediaGrant:
      type: apiKey
      in: header
      name: X-Media-Grant
      description: Secret embedded in private external PDF, bound to one export and fixed version; parent link live-view
        grant required. Browser uses the documented scoped HttpOnly cookie adapter; raw credentials are never stored
        in browser localStorage/sessionStorage.
    ServiceBearer:
      type: http
      scheme: bearer
      description: Narrow service identity plus per-job lease token; not an internal user token.
  schemas:
    JobEvent:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/Id'
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        stage:
          type: string
        sequence:
          type: integer
          minimum: 1
        event_type:
          type: string
          enum:
          - heartbeat
          - progress
          - succeeded
          - failed
        input_hash:
          type: string
        result_schema:
          $ref: '#/components/schemas/NullableText'
        result:
          type: object
          additionalProperties: true
          description: Validated by the allowlisted job/stage result schema. prepare_document uses contracts/json-schema/document-preparation.schema.json;
            source_asset_id is null only for direct pasted text, while real files require their verified asset ID.
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - event_id
      - job_id
      - attempt_id
      - lease_token
      - stage
      - sequence
      - event_type
      - input_hash
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        retryable:
          type: boolean
      required:
      - code
      - message
      - details
      - retryable
    NullableText:
      anyOf:
      - type: string
      - type: 'null'
    Id:
      type: string
      minLength: 1
      maxLength: 200
      description: Opaque resource identifier. Do not parse business meaning or assume source database PK type.
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        request_id:
          type: string
        error:
          $ref: '#/components/schemas/Error'
      required:
      - request_id
      - error
    Warning:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
        entity_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
      required:
      - code
      - message
      - entity_id
    JobEventReceipt:
      type: object
      additionalProperties: false
      properties:
        event_id:
          $ref: '#/components/schemas/Id'
        applied:
          type: boolean
        duplicate:
          type: boolean
        stale:
          type: boolean
        job_status:
          type: string
      required:
      - event_id
      - applied
      - duplicate
      - stale
      - job_status
    ServiceStageClaim:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        stage:
          type: string
        input_hash:
          type: string
        workflow_execution_id:
          type: string
      required:
      - job_id
      - stage
      - input_hash
    ServiceStageLease:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        stage:
          type: string
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        lease_expires_at:
          $ref: '#/components/schemas/DateTime'
        already_completed:
          type: boolean
        input:
          type: object
          additionalProperties: true
      required:
      - job_id
      - stage
      - attempt_id
      - lease_token
      - lease_expires_at
      - already_completed
      - input
    DateTime:
      type: string
      format: date-time
    MediaGrantRequest:
      type: object
      additionalProperties: false
      properties:
        export_id:
          $ref: '#/components/schemas/Id'
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
      required:
      - export_id
      - job_id
      - attempt_id
      - lease_token
    MediaGrantIssue:
      type: object
      additionalProperties: false
      properties:
        grant_id:
          $ref: '#/components/schemas/Id'
        grant_token:
          type: string
          description: Secret issued to active renderer only; store only verifier server-side and embed in private
            PDF. Never place raw token in jobs, outbox, manifest, logs or callback.
        version_id:
          $ref: '#/components/schemas/Id'
        export_id:
          $ref: '#/components/schemas/Id'
        expires_at:
          $ref: '#/components/schemas/DateTime'
        playback_path_template:
          type: string
      required:
      - grant_id
      - grant_token
      - version_id
      - export_id
      - expires_at
      - playback_path_template
    JobAssetAccess:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        asset_id:
          $ref: '#/components/schemas/Id'
        access:
          type: string
          enum:
          - read
          - write
          default: read
          description: Lease-scoped exact-object access. Write is only a newly reserved immutable output, never
            an original.
      required:
      - job_id
      - attempt_id
      - lease_token
      - asset_id
    ServiceAssetAccess:
      type: object
      additionalProperties: false
      description: Private service-only transfer capability. Headers are credentials and must not enter URLs, ordinary
        job metadata, logs or n8n envelopes. Exact object, method and lifetime are lease-bound; no arbitrary destination/signing
        interface exists.
      properties:
        asset_id:
          $ref: '#/components/schemas/Id'
        url:
          type: string
          format: uri
        method:
          type: string
          enum:
          - GET
          - POST
        headers:
          type: object
          additionalProperties:
            type: string
        expires_at:
          $ref: '#/components/schemas/DateTime'
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 1
        sha256:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - asset_id
      - url
      - method
      - headers
      - expires_at
      - mime_type
      - size_bytes
      - sha256
    JobOutputComplete:
      type: object
      additionalProperties: false
      properties:
        job_id:
          $ref: '#/components/schemas/Id'
        attempt_id:
          $ref: '#/components/schemas/Id'
        lease_token:
          type: string
        asset_id:
          $ref: '#/components/schemas/Id'
        sha256:
          type: string
        actual_size_bytes:
          type: integer
          minimum: 1
        width:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        height:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        duration_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
      required:
      - job_id
      - attempt_id
      - lease_token
      - asset_id
      - sha256
      - actual_size_bytes
      - width
      - height
      - duration_ms
    MediaAsset:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        purpose:
          type: string
          enum:
