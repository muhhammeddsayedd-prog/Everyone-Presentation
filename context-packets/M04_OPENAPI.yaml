        source_asset_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - facts
    ResizeSlots:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        desired_count:
          type: integer
          minimum: 1
        retire_slot_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - row_version
      - desired_count
    Role:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Id'
        workspace_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        headcount:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        category:
          $ref: '#/components/schemas/NullableText'
        requirements:
          $ref: '#/components/schemas/RoleRequirements'
        clarifications:
          type: array
          items:
            $ref: '#/components/schemas/Clarification'
        sort_order:
          type: integer
          minimum: 0
        row_version:
          $ref: '#/components/schemas/RowVersion'
        archived:
          type: boolean
      required:
      - id
      - workspace_id
      - name
      - headcount
      - category
      - requirements
      - clarifications
      - sort_order
      - row_version
      - archived
    Clarification:
      type: object
      additionalProperties: false
      properties:
        field_path:
          type: string
        reason:
          type: string
        source:
          anyOf:
          - $ref: '#/components/schemas/SourceReference'
          - type: 'null'
        resolved:
          type: boolean
      required:
      - field_path
      - reason
      - source
      - resolved
    SourceReference:
      type: object
      additionalProperties: false
      properties:
        asset_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        page:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
        paragraph:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        segment_index:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        start_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        end_ms:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        quote:
          $ref: '#/components/schemas/NullableText'
      required:
      - asset_id
      - page
      - paragraph
      - segment_index
      - start_ms
      - end_ms
      - quote
    RoleRequirements:
      type: object
      additionalProperties: false
      properties:
        age_range:
          $ref: '#/components/schemas/NullableText'
        gender_requirement:
          $ref: '#/components/schemas/NullableText'
        appearance_performance:
          $ref: '#/components/schemas/NullableText'
        languages:
          type: array
          items:
            type: string
        accents:
          type: array
          items:
            type: string
        skills:
          type: array
          items:
            type: string
        scene_references:
          type: array
          items:
            type: string
        shoot_dates:
          type: array
          items:
            type: string
        location:
          $ref: '#/components/schemas/NullableText'
        availability_requirements:
          $ref: '#/components/schemas/NullableText'
        other_instructions:
          $ref: '#/components/schemas/NullableText'
      required:
      - age_range
      - gender_requirement
      - appearance_performance
      - languages
      - accents
      - skills
      - scene_references
      - shoot_dates
      - location
      - availability_requirements
      - other_instructions
    SuggestedCandidateFilters:
      type: object
      additionalProperties: false
      properties:
        role_id:
          $ref: '#/components/schemas/Id'
        include_unknown:
          type: boolean
          const: true
        suggested_filters:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              field:
                type: string
                enum:
                - age_or_range
                - stated_gender
                - language
                - accent
                - skill
                - classification
              value:
                type: string
              source_field:
                type: string
            required:
            - field
            - value
            - source_field
        explanations:
          type: array
          items:
            type: string
      required:
      - role_id
      - include_unknown
      - suggested_filters
      - explanations
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
      description: Scoped to actor+operation; replay same body returns original response; different body returns
        409.
