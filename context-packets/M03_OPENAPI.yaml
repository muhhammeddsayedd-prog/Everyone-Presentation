    Success:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          const: true
        affected_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
      required:
      - success
      - affected_ids
    WorkspaceCandidatePatch:
      type: object
      additionalProperties: false
      properties:
        row_version:
