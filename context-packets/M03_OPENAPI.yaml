        candidate_id:
          $ref: '#/components/schemas/Id'
        selected_candidate_media_id:
          anyOf:
          - $ref: '#/components/schemas/Id'
          - type: 'null'
        selected_frame_asset_ids:
          type: array
          items:
            $ref: '#/components/schemas/Id'
          maxItems: 3
          uniqueItems: true
        availability:
          $ref: '#/components/schemas/NullableText'
        fresh_material_required:
          type: boolean
        media_confirmed:
          type: boolean
        internal_notes:
