      x-mcp-exposed: true
      x-shared-service-operation: search_candidates
      security:
      - InternalBearer: []
      parameters:
      - name: q
        in: query
        schema:
          type: string
      - name: include_unknown
        in: query
        schema:
          type: boolean
          default: true
        description: Structured filters may include unknown values explicitly labelled unknown; unknown does not
          mean requirements met. Does not bypass q text search.
      - name: age_or_range
        in: query
        schema:
          type: string
      - name: stated_gender
        in: query
        schema:
          type: string
      - name: height_measurements
        in: query
        schema:
          type: string
      - name: language
