          - type: 'null'
      required:
      - next_cursor
    ArchiveRequest:
      type: object
      additionalProperties: false
      properties:
        row_version:
          $ref: '#/components/schemas/RowVersion'
        reason:
          $ref: '#/components/schemas/NullableText'
      required:
